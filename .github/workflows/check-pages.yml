# 配信する HTML が data/*.json とずれていないか、検索エンジン・AI クローラーに読める形かを確かめる。
# このサイトは GitHub Pages が main 直下をそのまま配信する (ビルド工程なし・deploy workflow なし) ので、
# この workflow は deploy を止められない。PR で赤くなったらマージしないこと。
name: Check pages

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # data/*.json や index.html (全ページの型) を直したのに node scripts/build-pages.mjs を流し忘れると落ちる
      - name: Pages are up to date with data/*.json
        run: |
          node scripts/build-pages.mjs
          if [ -n "$(git status --porcelain)" ]; then
            git status --short
            git diff --stat
            echo "::error::node scripts/build-pages.mjs を実行して、出力 (index.html, season*/ thegirls/ shinsekai/, sitemap.xml) を commit してください"
            exit 1
          fi

      # 中身は scripts/seo-check.mjs の冒頭コメント (原本は satory074/basecamp)
      - name: SEO check
        run: node scripts/seo-check.mjs . https://satory074.github.io/produce101japan-ranking/ --require-backlink
